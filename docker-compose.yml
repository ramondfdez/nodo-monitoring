services:
  backend:
    build: ./backend
    container_name: nodo-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - metrics-history:/tmp  # Persistir histórico de métricas
      - ${HOST_PROC_SOURCE:-/tmp}:/host/proc:ro
      - ${HOST_SYS_SOURCE:-/tmp}:/host/sys:ro
      - ${HOST_ETC_SOURCE:-/tmp}:/host/etc:ro
    environment:
      - PORT=8080
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_HOSTNAME=/host/etc/hostname
      - ENABLE_SYSTEM_ACTIONS=${ENABLE_SYSTEM_ACTIONS:-false}
    restart: unless-stopped
    networks:
      - nodo-network
    privileged: ${NODO_PRIVILEGED:-false}

  frontend:
    build: ./frontend
    container_name: nodo-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nodo-network

networks:
  nodo-network:
    driver: bridge

volumes:
  metrics-history:  # Volumen para persistir histórico de métricas entre reinicios
